name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Set the repository variable API_URL (Settings > Variables) to the deployed API first;
    # without it there is nothing for the site to talk to, so it isn't published.
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: pages
        uses: actions/deploy-pages@v4
